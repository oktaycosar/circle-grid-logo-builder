# Circle Grid Logo Builder — GitHub Pages otomatik yayın
#
# main dalına her push'ta `npm run build` çalışır ve `dist/` klasörü
# GitHub Pages'e yayımlanır. Electron aşaması burada ÇALIŞMAZ (yalnız web).
#
# Tek seferlik kurulum GEREKMEZ: Pages'i iş akışı kendisi etkinleştirir
# (configure-pages → enablement: true), Settings'te elle "Source: GitHub Actions"
# seçmek gerekmez. Tek koşul deponun public olması (ya da hesabın Pro/Team
# olması); ücretsiz plan private depoda Pages'i desteklemez. Depo private
# kaldığı sürece yayımlama adımı uyarı vererek atlanır, CI kırmızı olmaz.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı dalda üst üste push olursa eski çalıştırmayı iptal et.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Derle (vite build)
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages_state.outputs.ok }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node 24 kur
        uses: actions/setup-node@v4
        with:
          # Testler `node --test tests/*.test.ts` ile çalışıyor; Node'un
          # TypeScript tip sıyırması gerektiğinden 22+ şart (yerel sürüm 24).
          node-version: 24
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci
        env:
          # Masaüstü paketi burada gerekli değil: ~150 MB'lık Electron
          # ikilisini indirmeyi atla (CI süresini ciddi kısaltır).
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Testleri çalıştır
        run: npm test

      - name: Üretim derlemesi (dist/)
        run: npm run build

      # GitHub Pages, ücretsiz planda yalnızca PUBLIC depolar için açılabilir;
      # private depo için GitHub Pro/Team gerekir. Depo private olduğu sürece bu
      # adım hata verir: `continue-on-error` sayesinde iş akışı kırmızı olmaz ve
      # yayımlama adımı atlanır. Depo public yapıldığında adım başarılı olur,
      # Pages otomatik etkinleşir ve site yayına girer — başka işlem gerekmez.
      - name: Sayfaları hazırla
        id: pages_setup
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pages kullanılabilir mi?
        id: pages_state
        run: |
          if [ "${{ steps.pages_setup.outcome }}" = "success" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Pages kapalı::Bu depo private ve plan ücretsiz olduğu için GitHub Pages açılamadı. Yayına almak için: Settings > General > Danger Zone > Change visibility > Public."
          fi

      - name: Artifact yükle
        if: steps.pages_state.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Yayımla
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages'e dağıt
        id: deployment
        uses: actions/deploy-pages@v4
